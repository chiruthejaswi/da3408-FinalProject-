global:
  scrape_interval: 5s          # near-real-time
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alert_rules.yml]
scrape_configs:
  - job_name: airsense-backend
    metrics_path: /metrics
    static_configs: [{targets: ["backend:8000"]}]
  - job_name: airsense-frontend
    static_configs: [{targets: ["frontend:8001"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
